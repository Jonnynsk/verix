name: Deploy Next.js to Reg.ru

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🚚 Получение кода
        uses: actions/checkout@v4

      - name: ⚙️ Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Установка зависимостей
        run: npm ci

      - name: 🛠 Сборка проекта
        run: npm run build
        env:
          YANDEX_VERIFICATION: ${{ secrets.YANDEX_VERIFICATION }}

      - name: 🗜 Создание архива и скрипта распаковки
        run: |
          cd out
          zip -qq -r ../build.zip .
          cd ..
          mkdir deploy_bundle
          mv build.zip deploy_bundle/
          cat << 'EOF' > deploy_bundle/unzip.php
          <?php
          $zip = new ZipArchive;
          if ($zip->open('build.zip') === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              unlink('build.zip');
              unlink(__FILE__);
              echo "SUCCESS";
          } else {
              http_response_code(500);
              echo "ERROR";
          }
          ?>
          EOF

      - name: 🚀 Деплой архива на сервер по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_bundle/
          server-dir: /
          timeout: 60000
          log-level: standard

      - name: 💥 Запуск распаковки на сервере
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "https://verix-cert.ru/unzip.php") 
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Распаковка прошла успешно!"
          else
            echo "Ошибка распаковки. HTTP статус: $HTTP_STATUS"
            exit 1
          fi