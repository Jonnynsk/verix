name: Deploy Next.js to Reg.ru

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🚚 Получение кода
        uses: actions/checkout@v4

      - name: ⚙️ Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Установка зависимостей
        run: npm ci

      - name: 🛠 Сборка проекта
        run: npm run build
        env:
          YANDEX_VERIFICATION: ${{ secrets.YANDEX_VERIFICATION }} 
          NEXT_PUBLIC_YANDEX_METRICA_ID: ${{ secrets.NEXT_PUBLIC_YANDEX_METRICA_ID }} 

      - name: 🚀 Деплой (Многопоточный lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -e "set ssl:verify-certificate no; mirror -R --parallel=20 --delete ./out/ / ; quit" ${{ secrets.FTP_SERVER }}
